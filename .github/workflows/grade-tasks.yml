name: Grade Tasks

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  Grade-Tasks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Make script executable
        run: chmod +x grade_task.sh

      - name: Decide number and run grading script
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ] && [ "${{ github.event.issue.number }}" = "1" ]; then
            number="${{ github.event.comment.body }}"
            echo "Running grade_task.sh (comment) with number: $number"
            ./grade_task.sh "$number"
          else
            echo "Skipping run, not schedule or valid issue comment."
          fi
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Upload results file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Task*/
          if ! git diff --cached --quiet; then
            git commit -m "Uploaded auto-grading result."
            git push origin master
          else
            echo "No changes to commit."
          fi
